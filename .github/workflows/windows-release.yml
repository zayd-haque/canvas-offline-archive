name: Windows release verification
on:
  push:
    branches: [main, 'codex/windows-release-verification', 'codex/windows-upgrade-verification']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m compileall -q canvas_app 'Canvas Module Downloader' bootstrap_windows.py
      - run: python -m unittest discover tests -v
      - name: One-click setup without Python on PATH
        run: python tools/verify_windows_first_run.py
      - run: python tools/verify_windows_release.py
      - run: python tools/verify_windows_upgrade.py
        env:
          TEST_GITHUB_TOKEN: ${{ github.token }}
      - run: python tools/build_release_package.py --platform windows --tag v1.0.15 "$env:RUNNER_TEMP\canvas-offline-archive-windows.zip"
