name: Windows release verification
on:
  push:
    branches: ['codex/windows-release-verification']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m compileall -q canvas_app 'Canvas Module Downloader' bootstrap_windows.py
      - run: python tools/verify_windows_release.py
